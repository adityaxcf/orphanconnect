<!DOCTYPE html>
<html>
<head>
    <title>Admin - OrphanConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dot-grid"></div>

    <nav class="navbar">
        <div class="nav-brand"><span>🏠</span><span>OrphanConnect — Admin</span></div>
        <div class="nav-right">
            <span class="nav-user">👤 Admin</span>
            <a href="login.html" class="nav-logout" onclick="localStorage.clear()">Logout</a>
        </div>
    </nav>

    <div class="owner-wrapper">
        <div class="owner-header">
            <h1>Admin Dashboard</h1>
            <p>Review and approve orphanage registration requests</p>
        </div>
        <div class="stats-row">
            <div class="stat-card"><span class="s-num" id="stat-total">0</span><span class="s-label">Total</span></div>
            <div class="stat-card"><span class="s-num" id="stat-pending">0</span><span class="s-label">Pending</span></div>
            <div class="stat-card"><span class="s-num" id="stat-approved">0</span><span class="s-label">Approved</span></div>
            <div class="stat-card"><span class="s-num" id="stat-rejected">0</span><span class="s-label">Rejected</span></div>
        </div>
        <div class="section-title">🏠 Orphanage Registration Requests</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="filterOrphanages('all', this)">All</button>
            <button class="tab-btn" onclick="filterOrphanages('pending', this)">Pending</button>
            <button class="tab-btn" onclick="filterOrphanages('approved', this)">Approved</button>
            <button class="tab-btn" onclick="filterOrphanages('rejected', this)">Rejected</button>
        </div>
        <div id="orphanages-list"></div>
    </div>

    <script>
        const API = "http://localhost:3001/api";

        // ✅ FIX: auth guard — redirect if not admin
        var currentUser = JSON.parse(localStorage.getItem("currentUser")||"{}");
        if(!localStorage.getItem("token") || currentUser.role !== "admin"){
            window.location.href = "login.html";
        }

        var allOrphanages = [];
        function getToken(){ return localStorage.getItem("token")||""; }

        async function loadOrphanages(){
            var res = await fetch(API+"/orphanages/admin/all", {
                headers: {"Authorization":"Bearer "+getToken()}
            });
            allOrphanages = await res.json();
            updateStats();
            renderOrphanages("all");
        }

        function updateStats(){
            document.getElementById("stat-total").textContent = allOrphanages.length;
            document.getElementById("stat-pending").textContent = allOrphanages.filter(function(o){return o.status=="pending";}).length;
            document.getElementById("stat-approved").textContent = allOrphanages.filter(function(o){return o.status=="approved";}).length;
            document.getElementById("stat-rejected").textContent = allOrphanages.filter(function(o){return o.status=="rejected";}).length;
        }

        function filterOrphanages(status, btn){
            document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
            btn.classList.add("active");
            renderOrphanages(status);
        }

        function renderOrphanages(status){
            var filtered = status==="all" ? allOrphanages : allOrphanages.filter(function(o){return o.status===status;});
            var container = document.getElementById("orphanages-list");

            if(filtered.length===0){
                container.innerHTML='<div class="empty-state">No orphanage requests found.</div>';
                return;
            }

            var html="";
            filtered.slice().reverse().forEach(function(o){
                var date = new Date(o.createdAt).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
                var actionHtml = o.status==="pending"
                    ? '<div class="action-btns">'+
                      '<button class="btn-approve" onclick="updateStatus(\''+o._id+'\',\'approved\')">✓ Approve</button>'+
                      '<button class="btn-reject" onclick="updateStatus(\''+o._id+'\',\'rejected\')">✗ Reject</button>'+
                      '</div>'
                    : '<span class="status-badge '+o.status+'">'+o.status+'</span>';

                html+='<div class="ticket-row">';
                html+='<div class="ticket-row-icon donate">🏠</div>';
                html+='<div class="ticket-row-info">';
                html+='<h3>'+o.name+'</h3>';
                html+='<p>📍 '+o.address+'</p>';
                html+='<p>👤 '+o.ownerName+' · 📧 '+o.ownerEmail+' · 📞 '+o.ownerPhone+'</p>';
                html+='<p>🛏️ Capacity: '+o.capacity+' · Occupied: '+o.occupied+' · Vacant: '+o.vacant+'</p>';
                html+='<span class="row-meta">Submitted on '+date+'</span>';
                html+='</div>';
                html+='<div class="ticket-row-actions">'+actionHtml+'</div>';
                html+='</div>';
            });
            container.innerHTML = html;
        }

        async function updateStatus(orphanageId, status){
            var res = await fetch(API+"/orphanages/"+orphanageId+"/status", {
                method: "PATCH",
                headers: {"Content-Type":"application/json","Authorization":"Bearer "+getToken()},
                body: JSON.stringify({status})
            });
            if(res.ok){ await loadOrphanages(); }
            else { alert("Failed to update status."); }
        }

        loadOrphanages();
    </script>

</body>
</html>
