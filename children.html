<!DOCTYPE html>
<html>
<head>
    <title>Children - OrphanConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dot-grid"></div>

    <nav class="navbar">
        <div class="nav-brand"><span>🏠</span><span>OrphanConnect</span></div>
        <div class="nav-right">
            <a href="home.html" class="nav-back">← Back</a>
            <a href="login.html" class="nav-logout" onclick="localStorage.clear()">Logout</a>
        </div>
    </nav>

    <div class="children-wrapper">
        <div class="children-header">
            <h1>Children Available for Adoption</h1>
            <p id="orphanage-label">Loading...</p>
        </div>
        <!-- ✅ FIX: hidden by default, only shown if ticket is approved -->
        <div class="info-banner" id="info-banner" style="display:none;">
            ✅ Your adoption request was approved. Please select a child to submit your final adoption request.
        </div>
        <div class="children-grid" id="children-grid"></div>
    </div>

    <script>
        const API = "http://localhost:3001/api";

        // ✅ FIX: auth guard
        if(!localStorage.getItem("token")){ window.location.href = "login.html"; }

        var params = new URLSearchParams(window.location.search);
        var orphanageId = params.get("orphanage");

        function getToken(){ return localStorage.getItem("token")||""; }

        async function checkApproval(){
            // ✅ FIX: only show banner if user actually has an approved adopt ticket for this orphanage
            var res = await fetch(API+"/tickets/mine", { headers: {"Authorization":"Bearer "+getToken()} });
            var tickets = await res.json();
            var hasApproved = tickets.some(function(t){
                return t.type==="adopt" && t.status==="approved" && t.orphanageId===orphanageId;
            });
            if(hasApproved){
                document.getElementById("info-banner").style.display = "block";
            }
        }

        async function loadChildren(){
            var res = await fetch(API+"/orphanages/"+orphanageId);
            var orphanage = await res.json();
            document.getElementById("orphanage-label").textContent = orphanage.name+", Hubli, Karnataka";

            var cRes = await fetch(API+"/children/"+orphanageId);
            var children = await cRes.json();
            var grid = document.getElementById("children-grid");

            if(children.length===0){
                grid.innerHTML='<p class="no-children-msg">No children listed yet. Please check back later.</p>';
                return;
            }

            var html="";
            children.forEach(function(child){
                var tags = (child.tags||[]).map(function(t){return '<span class="child-tag">'+t+'</span>';}).join("");
                html+='<div class="child-card">';
                html+='<div class="child-avatar '+(child.gender||"boy")+'">'+(child.gender==="girl"?"👧":"👦")+'</div>';
                html+='<div class="child-body">';
                html+='<h3>'+child.name+'</h3>';
                html+='<p class="child-age">'+child.age+' years old</p>';
                html+='<p class="child-about">'+child.about+'</p>';
                html+='<div class="child-tags">'+tags+'</div>';
                html+='<button class="adopt-child-btn" onclick="adoptChild(\''+child._id+'\',\''+child.name+'\')">Request to Adopt</button>';
                html+='</div></div>';
            });
            grid.innerHTML = html;
        }

        async function adoptChild(childId, childName){
            if(confirm("Submit an adoption request for "+childName+"?")){
                var ticket = {
                    orphanageId: orphanageId,
                    orphanageName: document.getElementById("orphanage-label").textContent,
                    type: "adopt-final",
                    childId: childId,
                    childName: childName,
                    userName: JSON.parse(localStorage.getItem("currentUser")||"{}").name||"",
                    userEmail: JSON.parse(localStorage.getItem("currentUser")||"{}").email||"",
                    userPhone: ""
                };
                var res = await fetch(API+"/tickets", {
                    method: "POST",
                    headers: {"Content-Type":"application/json","Authorization":"Bearer "+getToken()},
                    body: JSON.stringify(ticket)
                });
                if(res.ok){
                    alert("Your request to adopt "+childName+" has been submitted!");
                    window.location.href = "tickets.html";
                } else {
                    alert("Something went wrong. Please try again.");
                }
            }
        }

        checkApproval();
        loadChildren();
    </script>

</body>
</html>
